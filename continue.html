<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continue</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#050505;
color:#fff;
font-family:Inter;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#111;
padding:25px;
border-radius:20px;
width:90%;
max-width:320px;
text-align:center;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:12px;
margin:12px 0;
background:#222;
color:#fff;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:25px;
background:#22c55e;
color:#000;
}

.success{
color:#22c55e;
font-size:18px;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="box" id="box">
<h3>Enter UID</h3>
<input placeholder="Enter UID">
<button onclick="done()">Submit</button>
</div>

<script>
function done(){
document.getElementById("box").innerHTML=`
<div class="success">✔ Verification Complete</div>
<p style="opacity:0.6">Processing...</p>
`;
}
</script>

</body>
</html>
